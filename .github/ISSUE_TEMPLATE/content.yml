name: Conteúdo ou distribuição
description: Sugira uma correção de guia, tradução, comando, fonte ou instalador.
title: "[Content]: "
labels: [content]
body:
  - type: input
    id: area
    attributes:
      label: Área afetada
      placeholder: "Arch, Fedora, tradução pt-BR, download"
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Correção proposta
      description: Explique o que está incorreto e qual seria o comportamento/documentação correto.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Fonte pública
      description: Inclua documentação oficial ou referência verificável.
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validação realizada
      description: Informe distribuição, versão, comando ou formato testado, sem dados pessoais.
    validations:
      required: true
